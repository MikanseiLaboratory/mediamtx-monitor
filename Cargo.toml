[workspace]
resolver = "2"
members = ["crates/mtm-core", "crates/mediamtx-monitor"]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/MikanseiLaboratory/mediamtx-monitor"
authors = ["MikanseiLaboratory"]

[workspace.dependencies]
mtm-core = { path = "crates/mtm-core", version = "0.1.0-alpha.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true