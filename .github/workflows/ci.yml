name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------
  # バックエンド（コアは OS 非依存、アダプタは Windows/Linux 両方で検証）
  # ---------------------------------------------------------------
  rust:
    name: lint / test (rust, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux のビルド依存（Tauri / WebKitGTK）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config build-essential

      - name: フロントエンドのビルド（Rust ジョブにも必要）
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 依存インストールとビルド
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Rust ツールチェーン
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: フォーマット
        run: cargo fmt --all -- --check

      - name: Clippy（警告はエラー）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 単体テスト
        # live_mediamtx は MTM_LIVE=1 のときだけ実行されるので、ここでは即スキップ。
        run: cargo test --workspace

  # ---------------------------------------------------------------
  # フロントエンド（型検査・単体テスト・ビルド）
  # ---------------------------------------------------------------
  web:
    name: lint / test / build (web)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 依存インストール
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: 型検査
        working-directory: web
        run: pnpm run typecheck

      - name: 単体テスト（Vitest）
        working-directory: web
        run: pnpm test

      - name: 本番ビルド
        working-directory: web
        run: pnpm run build

      - name: ビルド成果物を保存
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ---------------------------------------------------------------
  # UI 受け入れ（Playwright、モックブリッジで描画と確認ダイアログを検証）
  # ---------------------------------------------------------------
  ui:
    name: UI e2e (playwright)
    runs-on: ubuntu-24.04
    needs: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 依存インストール
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: ブラウザの準備
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: 本番ビルド
        working-directory: web
        run: pnpm run build

      - name: Playwright（UI 受け入れ + スクリーンショット）
        working-directory: web
        run: pnpm exec playwright test

      - name: スクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: web/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: 失敗時の記録を保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-trace
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
