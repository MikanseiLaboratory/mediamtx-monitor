name: release

# タグ push（v*）か手動実行で、Windows のインストーラと Linux のパッケージを作ります。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux のビルド依存
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config build-essential

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - name: フロントエンドのビルド
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Tauri CLI の準備
        run: cargo install tauri-cli --version "^2.11" --locked

      - name: アプリのビルド（インストーラ付き）
        working-directory: crates/mediamtx-monitor
        run: cargo tauri build --ci ${{ runner.os == 'Linux' && '--bundles deb' || '' }}

      - name: 成果物をリリースへ添付
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            target/release/bundle/nsis/*
            target/release/bundle/msi/*
            target/release/bundle/deb/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
